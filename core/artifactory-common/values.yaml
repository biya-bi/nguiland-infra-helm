# Default values for the artifactory-common library chart.

systemName: artifactory

image:
  repository: releases-docker.jfrog.io/jfrog/artifactory
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: docker-config

dataChown:
  # Enable the data ownership correction init container.
  # Set to false to disable the chown step when the volume already has correct permissions.
  enabled: true

service:
  port: 8081
  name: artifactoryport

cleanup:
  # List of additional ConfigMap names (in the same namespace) whose keys
  # will be projected into /run/scripts/cleanup in the cleanup sidecar.
  extraConfigMaps: []
  # Optional environment variables exposed only to the cleanup sidecar.
  env: []
  # Image used for the cleanup sidecar. Consumers can override to provide tools like `curl`.
  image:
    repository: bash
    tag: "5.3"
    pullPolicy: IfNotPresent
