{{- define "artifactory-common.deployment" -}}
{{- $values := .Values | toYaml | fromYaml -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory-common.fullname" . }}
  labels:
    {{- include "artifactory-common.labels" . | nindent 4 }}
spec:
  {{- if .Values.strategy }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  {{- else if (index .Values "artifactory-common" "strategy") }}
  strategy:
    {{- toYaml (index .Values "artifactory-common" "strategy") | nindent 4 }}
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  {{- if not (and (.Values.autoscaling | default (index .Values "artifactory-common" "autoscaling")) (.Values.autoscaling.enabled | default (index .Values "artifactory-common" "autoscaling" "enabled"))) }}
  replicas: {{ .Values.replicaCount | default (index .Values "artifactory-common" "replicaCount") | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "artifactory-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations | default (index .Values "artifactory-common" "podAnnotations") | default dict }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "artifactory-common.labels" . | nindent 8 }}
        {{- with .Values.podLabels | default (index .Values "artifactory-common" "podLabels") | default dict }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets | default (index .Values "artifactory-common" "imagePullSecrets") }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "artifactory-common.serviceAccountName" . }}
      securityContext:
        {{- $podSec := .Values.podSecurityContext | default (index .Values "artifactory-common" "podSecurityContext") | default dict -}}
        {{- $podSec = mergeOverwrite (dict "fsGroup" 1030 "runAsUser" 1030 "runAsGroup" 1030 "fsGroupChangePolicy" "OnRootMismatch") $podSec -}}
        {{- toYaml $podSec | nindent 8 }}
      {{- $dataChownEnabled := true -}}
      {{- $dataChownRaw := .Values.dataChown | default (index .Values "artifactory-common" "dataChown") -}}
      {{- if hasKey .Values "dataChown" -}}
        {{- if kindIs "map" .Values.dataChown -}}
          {{- $dataChownEnabled = .Values.dataChown.enabled | default true -}}
        {{- else -}}
          {{- $dataChownEnabled = .Values.dataChown -}}
        {{- end -}}
      {{- else if hasKey (index .Values "artifactory-common") "dataChown" -}}
        {{- if kindIs "map" (index .Values "artifactory-common" "dataChown") -}}
          {{- $dataChownEnabled = (index .Values "artifactory-common" "dataChown" "enabled") | default true -}}
        {{- else -}}
          {{- $dataChownEnabled = (index .Values "artifactory-common" "dataChown") -}}
        {{- end -}}
      {{- end -}}
      {{- if $dataChownEnabled }}
      initContainers:
        - name: {{ include "artifactory-common.fullname" . }}-init-chown
          image: "{{ .Values.image.repository | default (index .Values "artifactory-common" "image" "repository") }}:{{ .Values.image.tag | default (index .Values "artifactory-common" "image" "tag") | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default (index .Values "artifactory-common" "image" "pullPolicy") | default "IfNotPresent" }}
          command:
            - sh
            - -c
            - |
              chown -R 1030:1030 /var/opt/jfrog/artifactory
              chmod -R u+rwX /var/opt/jfrog/artifactory
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: {{ include "artifactory-common.fullname" . }}-data
              mountPath: /var/opt/jfrog/artifactory
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            {{- toYaml (.Values.commands | default (index .Values "artifactory-common" "commands") | default (list "/run/scripts/artifactory/run.sh")) | nindent 12 }}
          securityContext:
            {{- $contSec := .Values.securityContext | default (index .Values "artifactory-common" "securityContext") | default dict -}}
            {{- $contSec = mergeOverwrite (dict "runAsNonRoot" true "allowPrivilegeEscalation" false) $contSec -}}
            {{- toYaml $contSec | nindent 12 }}
          image: "{{ .Values.image.repository | default (index .Values "artifactory-common" "image" "repository") }}:{{ .Values.image.tag | default (index .Values "artifactory-common" "image" "tag") | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default (index .Values "artifactory-common" "image" "pullPolicy") | default "IfNotPresent" }}
          ports:
            - name: {{ .Values.service.name | default (index .Values "artifactory-common" "service" "name") }}
              containerPort: {{ .Values.service.port | default (index .Values "artifactory-common" "service" "port") }}
              protocol: {{ .Values.service.protocol | default (index .Values "artifactory-common" "service" "protocol") | default "TCP" }}
          startupProbe:
            {{- $sp := .Values.startupProbe | default (index .Values "artifactory-common" "startupProbe") | default dict -}}
            {{- $spDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" (.Values.service.port | default (index .Values "artifactory-common" "service" "port"))) "failureThreshold" 60 "periodSeconds" 10 -}}
            {{- $sp = mergeOverwrite $spDefault $sp -}}
            {{- toYaml $sp | nindent 12 }}
          livenessProbe:
            {{- $lp := .Values.livenessProbe | default (index .Values "artifactory-common" "livenessProbe") | default dict -}}
            {{- $lpDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" (.Values.service.port | default (index .Values "artifactory-common" "service" "port"))) "initialDelaySeconds" 10 "periodSeconds" 10 -}}
            {{- $lp = mergeOverwrite $lpDefault $lp -}}
            {{- toYaml $lp | nindent 12 }}
          readinessProbe:
            {{- $rp := .Values.readinessProbe | default (index .Values "artifactory-common" "readinessProbe") | default dict -}}
            {{- $rpDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" (.Values.service.port | default (index .Values "artifactory-common" "service" "port"))) "initialDelaySeconds" 10 "periodSeconds" 10 -}}
            {{- $rp = mergeOverwrite $rpDefault $rp -}}
            {{- toYaml $rp | nindent 12 }}
          resources:
            {{- $res := .Values.resources | default (index .Values "artifactory-common" "resources") | default dict -}}
            {{- $resDefault := dict "requests" (dict "cpu" "500m" "memory" "2Gi") "limits" (dict "cpu" "1000m" "memory" "4Gi") -}}
            {{- $res = mergeOverwrite $resDefault $res -}}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - mountPath: /run/scripts/artifactory/run.sh
              name: {{ include "artifactory-common.fullname" . }}-entrypoint
              subPath: run.sh
            - mountPath: /var/opt/jfrog/artifactory
              name: {{ include "artifactory-common.fullname" . }}-data
            - mountPath: /run/secrets/artifactory/{{ .Values.systemName | default (index .Values "artifactory-common" "systemName") }}
              name: {{ include "artifactory-common.fullname" . }}-secret
            - mountPath: /run/secrets/artifactory/access/bootstrap.creds
              subPath: bootstrap.creds
              name: {{ include "artifactory-common.fullname" . }}-secret
            - mountPath: /run/configs/artifactory/artifactory.config.import.yml
              subPath: artifactory.config.import.yml
              name: {{ include "artifactory-common.fullname" . }}-config
            {{- with .Values.volumeMounts | default (index .Values "artifactory-common" "volumeMounts") }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- $defaultEnv := dict "JF_PRODUCT_HOME" "/opt/jfrog/artifactory" "JF_ARTIFACTORY_USER" "artifactory" "JF_ROUTER_ENTRYPOINTS_EXTERNAL_ADDRESS_STRATEGY" "ipv4" "EXTRA_JAVA_OPTS" "-Djava.net.preferIPv4Stack=true" -}}
            {{- $envMap := .Values.envMap | default (index .Values "artifactory-common" "envMap") | default dict -}}
            {{- $envMap = mergeOverwrite $defaultEnv $envMap -}}
            {{- range $name, $value := $envMap }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- else if (index .Values "artifactory-common" "extraEnv") }}
            {{- toYaml (index .Values "artifactory-common" "extraEnv") | nindent 12 }}
            {{- end }}
        - name: cleanup-sidecar
          image: bash:5.3
          command:
            - /run/scripts/cleanup/start.sh
          lifecycle:
            preStop:
              exec:
                command:
                  - bash
                  - -c
                  - /run/scripts/cleanup/stop.sh > /proc/1/fd/1 2>&1
          volumeMounts:
            - mountPath: /run/scripts/cleanup
              name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
            - mountPath: /run/scripts/util
              name: {{ include "artifactory-common.fullname" . }}-util-scripts
            - mountPath: /var/opt/jfrog/artifactory
              name: {{ include "artifactory-common.fullname" . }}-data
          env:
            - name: ARTIFACTORY_PING_URL
              value: {{ dig "cleanup" "pingUrl" "http://localhost:8082/artifactory/api/system/ping" $values | quote }}
      volumes:
        - name: {{ include "artifactory-common.fullname" . }}-entrypoint
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-entrypoint
            defaultMode: 0755
            items:
              - key: run.sh
                path: run.sh
        - name: {{ include "artifactory-common.fullname" . }}-data
          persistentVolumeClaim:
            claimName: {{ include "artifactory-common.fullname" . }}-data
        - name: {{ include "artifactory-common.fullname" . }}-secret
          secret:
            secretName: {{ include "artifactory-common.fullname" . }}
        - name: {{ include "artifactory-common.fullname" . }}-config
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-config
            defaultMode: 0644
        - name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
            defaultMode: 0755
        - name: {{ include "artifactory-common.fullname" . }}-util-scripts
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-util-scripts
        {{- with .Values.volumes | default (index .Values "artifactory-common" "volumes") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector | default (index .Values "artifactory-common" "nodeSelector") }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity | default (index .Values "artifactory-common" "affinity") }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations | default (index .Values "artifactory-common" "tolerations") }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}