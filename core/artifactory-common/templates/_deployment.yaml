{{- define "artifactory-common.deployment" -}}
{{- $values := .Values | toYaml | fromYaml -}}

{{- /* Deployment Strategy and Replica Configuration */ -}}
{{- $strategy := dig "strategy" dict $values | default (dig "artifactory-common" "strategy" dict $values) | default (dict "type" "Recreate") -}}
{{- $autoscalingEnabled := dig "autoscaling" "enabled" false $values | default (dig "artifactory-common" "autoscaling" "enabled" false $values) -}}
{{- $replicaCount := dig "replicaCount" nil $values | default (dig "artifactory-common" "replicaCount" nil $values) | default 1 -}}

{{- /* Pod Security Context */ -}}
{{- $podSecurityContext := $values.podSecurityContext | default (index $values "artifactory-common" "podSecurityContext") | default dict | deepCopy -}}
{{- $podSecurityContextDefault := dict "fsGroup" 1030 "runAsUser" 1030 "runAsGroup" 1030 "fsGroupChangePolicy" "OnRootMismatch" -}}
{{- $podSecurityContext = mergeOverwrite $podSecurityContextDefault $podSecurityContext -}}

{{- /* Main Container Security Context */ -}}
{{- $containerSecurityContext := $values.securityContext | default (index $values "artifactory-common" "securityContext") | default dict | deepCopy -}}
{{- $containerSecurityContextDefault := dict "runAsNonRoot" true "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL")) -}}
{{- $containerSecurityContext = mergeOverwrite $containerSecurityContextDefault $containerSecurityContext -}}

{{- /* Init Container Security Context */ -}}
{{- $initContainerSecurityContext := dict "runAsUser" 0 "runAsGroup" 0 -}}

{{- /* Service Configuration */ -}}
{{- $servicePort := dig "service" "port" nil $values | default (dig "artifactory-common" "service" "port" nil $values) | default 8082 -}}
{{- $serviceName := dig "service" "name" nil $values | default (dig "artifactory-common" "service" "name" nil $values) | default "http" -}}
{{- $serviceProtocol := dig "service" "protocol" nil $values | default (dig "artifactory-common" "service" "protocol" nil $values) | default "TCP" -}}

{{- /* Startup Probe */ -}}
{{- $startupProbe := dig "startupProbe" dict $values | default (dig "artifactory-common" "startupProbe" dict $values) | deepCopy -}}
{{- $startupProbeDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" $servicePort) "failureThreshold" 60 "periodSeconds" 10 -}}
{{- $startupProbe = mergeOverwrite $startupProbeDefault $startupProbe -}}

{{- /* Liveness Probe */ -}}
{{- $livenessProbe := dig "livenessProbe" dict $values | default (dig "artifactory-common" "livenessProbe" dict $values) | deepCopy -}}
{{- $livenessProbeDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" $servicePort) "initialDelaySeconds" 10 "periodSeconds" 10 -}}
{{- $livenessProbe = mergeOverwrite $livenessProbeDefault $livenessProbe -}}

{{- /* Readiness Probe */ -}}
{{- $readinessProbe := dig "readinessProbe" dict $values | default (dig "artifactory-common" "readinessProbe" dict $values) | deepCopy -}}
{{- $readinessProbeDefault := dict "httpGet" (dict "path" "/artifactory/api/system/ping" "port" $servicePort) "initialDelaySeconds" 10 "periodSeconds" 10 -}}
{{- $readinessProbe = mergeOverwrite $readinessProbeDefault $readinessProbe -}}

{{- /* Resources Configuration */ -}}
{{- $resources := dig "resources" dict $values | default (dig "artifactory-common" "resources" dict $values) | deepCopy -}}
{{- $resourcesDefault := dict "requests" (dict "cpu" "500m" "memory" "2Gi") "limits" (dict "cpu" "1000m" "memory" "4Gi") -}}
{{- $resources = mergeOverwrite $resourcesDefault $resources -}}

{{- /* Environment Variables Configuration */ -}}
{{- $envMap := dig "envMap" dict $values | default (dig "artifactory-common" "envMap" dict $values) | deepCopy -}}
{{- $defaultEnvMap := dict "JF_PRODUCT_HOME" "/opt/jfrog/artifactory" "JF_ARTIFACTORY_USER" "artifactory" "JF_ROUTER_ENTRYPOINTS_EXTERNAL_ADDRESS_STRATEGY" "ipv4" "EXTRA_JAVA_OPTS" "-Djava.net.preferIPv4Stack=true" -}}
{{- $envMap = mergeOverwrite $defaultEnvMap $envMap -}}
{{- $extraEnv := dig "extraEnv" list $values | default (dig "artifactory-common" "extraEnv" list $values) -}}
{{- $allEnvs := list -}}
{{- range $k, $v := $envMap -}}
  {{- $allEnvs = append $allEnvs (dict "name" $k "value" ($v | toString)) -}}
{{- end -}}
{{- $allEnvs = concat $allEnvs $extraEnv -}}
 
{{- /* Data Chown Configuration */ -}}
{{- $dataChownConfig := dig "dataChown" nil $values | default (dig "artifactory-common" "dataChown" nil $values) -}}
{{- $dataChownEnabled := true -}}
{{- if kindIs "map" $dataChownConfig -}}
  {{- $dataChownEnabled = dig "enabled" true $dataChownConfig -}}
{{- else if kindIs "bool" $dataChownConfig -}}
  {{- $dataChownEnabled = $dataChownConfig -}}
{{- end -}}

{{- /* Pod Scheduling Configuration */ -}}
{{- $nodeSelector := dig "nodeSelector" dict $values | default (dig "artifactory-common" "nodeSelector" dict $values) -}}
{{- $affinity := dig "affinity" dict $values | default (dig "artifactory-common" "affinity" dict $values) -}}
{{- $tolerations := dig "tolerations" list $values | default (dig "artifactory-common" "tolerations" list $values) -}}

{{- /* Image and Command Configuration */ -}}
{{- $imageRepository := dig "image" "repository" nil $values | default (dig "artifactory-common" "image" "repository" nil $values) -}}
{{- $imageTag := dig "image" "tag" nil $values | default (dig "artifactory-common" "image" "tag" nil $values) | default .Chart.AppVersion -}}
{{- $imagePullPolicy := dig "image" "pullPolicy" nil $values | default (dig "artifactory-common" "image" "pullPolicy" nil $values) | default "IfNotPresent" -}}
{{- $imagePullSecrets := dig "imagePullSecrets" list $values | default (dig "artifactory-common" "imagePullSecrets" list $values) | default (list (dict "name" "docker-config")) -}}
{{- $commands := dig "commands" nil $values | default (dig "artifactory-common" "commands" nil $values) | default (list "/run/scripts/artifactory/run.sh") -}}

{{- /* Volume and Annotation/Label Configuration */ -}}
{{- $extraVolumes := dig "volumes" list $values | default (dig "artifactory-common" "volumes" list $values) -}}
{{- $extraVolumeMounts := dig "volumeMounts" list $values | default (dig "artifactory-common" "volumeMounts" list $values) -}}
{{- $podAnnotations := dig "podAnnotations" dict $values | default (dig "artifactory-common" "podAnnotations" dict $values) -}}
{{- $podLabels := dig "podLabels" dict $values | default (dig "artifactory-common" "podLabels" dict $values) -}}
{{- $systemName := dig "systemName" nil $values | default (dig "artifactory-common" "systemName" nil $values) | default .Chart.Name -}}

{{- /* Sidecar Configuration */ -}}
{{- $cleanupPingUrl := dig "cleanup" "pingUrl" nil $values | default (printf "http://localhost:%d/artifactory/api/system/ping" (int $servicePort)) | quote -}}
{{- $cleanupExtraConfigMaps := dig "cleanup" "extraConfigMaps" list $values | default (dig "artifactory-common" "cleanup" "extraConfigMaps" list $values) -}}
{{- $cleanupEnvMap := dig "cleanup" "envMap" dict $values | default (dig "artifactory-common" "cleanup" "envMap" dict $values) -}}
{{- $cleanupEnvFromMap := list -}}
{{- range $k, $v := $cleanupEnvMap -}}
  {{- $cleanupEnvFromMap = append $cleanupEnvFromMap (dict "name" $k "value" ($v | toString)) -}}
{{- end -}}
{{- $cleanupEnv := dig "cleanup" "env" list $values | default (dig "artifactory-common" "cleanup" "env" list $values) -}}
{{- $cleanupAllEnvs := concat $cleanupEnvFromMap $cleanupEnv (list (dict "name" "ARTIFACTORY_PING_URL" "value" $cleanupPingUrl)) -}}
{{- $cleanupImage := dig "cleanup" "image" dict $values | default (dig "artifactory-common" "cleanup" "image" dict $values) | default dict -}}
{{- $cleanupImageRepository := dig "repository" "" $cleanupImage | default "bash" -}}
{{- $cleanupImageTag := dig "tag" "" $cleanupImage | default "5.3" -}}
{{- $cleanupImagePull := dig "pullPolicy" "" $cleanupImage | default "IfNotPresent" -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory-common.fullname" . }}
  labels:
    {{- include "artifactory-common.labels" . | nindent 4 }}
spec:
  strategy:
    {{- toYaml $strategy | nindent 4 }}
  {{- if not $autoscalingEnabled }}
  replicas: {{ $replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "artifactory-common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "artifactory-common.labels" . | nindent 8 }}
        {{- with $podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "artifactory-common.serviceAccountName" . }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- if $dataChownEnabled }}
      initContainers:
        - name: {{ include "artifactory-common.fullname" . }}-init-chown
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              chown -R 1030:1030 /var/opt/jfrog/artifactory
              chmod -R u+rwX /var/opt/jfrog/artifactory
          securityContext:
            {{- toYaml $initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: {{ include "artifactory-common.fullname" . }}-data
              mountPath: /var/opt/jfrog/artifactory
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          command:
            {{- toYaml $commands | nindent 12 }}
          securityContext:
            {{- toYaml $containerSecurityContext | nindent 12 }}
          image: "{{ $imageRepository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $imagePullPolicy }}
          ports:
            - name: {{ $serviceName }}
              containerPort: {{ $servicePort }}
              protocol: {{ $serviceProtocol }}
          startupProbe:
            {{- toYaml $startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - mountPath: /run/scripts/artifactory/run.sh
              name: {{ include "artifactory-common.fullname" . }}-entrypoint
              subPath: run.sh
            - mountPath: /var/opt/jfrog/artifactory
              name: {{ include "artifactory-common.fullname" . }}-data
            - mountPath: /run/secrets/artifactory/{{ $systemName }}
              name: {{ include "artifactory-common.fullname" . }}-secret
            - mountPath: /run/secrets/artifactory/access/bootstrap.creds
              subPath: bootstrap.creds
              name: {{ include "artifactory-common.fullname" . }}-secret
            - mountPath: /run/configs/artifactory/artifactory.config.import.yml
              subPath: artifactory.config.import.yml
              name: {{ include "artifactory-common.fullname" . }}-config
            {{- with $extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- toYaml $allEnvs | nindent 12 }}
        - name: cleanup-sidecar
          image: "{{ printf "%s:%s" $cleanupImageRepository $cleanupImageTag }}"
          imagePullPolicy: {{ $cleanupImagePull }}
          command:
            - /run/scripts/cleanup/start.sh
          securityContext:
            {{- toYaml $containerSecurityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - bash
                  - -c
                  - /run/scripts/cleanup/stop.sh > /proc/1/fd/1 2>&1
          volumeMounts:
            - mountPath: /run/scripts/cleanup
              name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
            - mountPath: /run/scripts/util
              name: {{ include "artifactory-common.fullname" . }}-util-scripts
            - mountPath: /var/opt/jfrog/artifactory
              name: {{ include "artifactory-common.fullname" . }}-data
          env:
            {{- toYaml $cleanupAllEnvs | nindent 12 }}
      volumes:
        - name: {{ include "artifactory-common.fullname" . }}-entrypoint
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-entrypoint
            defaultMode: 0755
            items:
              - key: run.sh
                path: run.sh
        - name: {{ include "artifactory-common.fullname" . }}-data
          persistentVolumeClaim:
            claimName: {{ include "artifactory-common.fullname" . }}-data
        - name: {{ include "artifactory-common.fullname" . }}-secret
          secret:
            secretName: {{ include "artifactory-common.fullname" . }}
        - name: {{ include "artifactory-common.fullname" . }}-config
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-config
            defaultMode: 0644
        - name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: {{ include "artifactory-common.fullname" . }}-cleanup-scripts
              {{- with $cleanupExtraConfigMaps }}
              {{- range $configMap := . }}
              - configMap:
                  name: {{ $configMap }}
              {{- end }}
              {{- end }}
        - name: {{ include "artifactory-common.fullname" . }}-util-scripts
          configMap:
            name: {{ include "artifactory-common.fullname" . }}-util-scripts
        {{- with $extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}