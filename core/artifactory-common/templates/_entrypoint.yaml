{{- define "artifactory-common.entrypoint" -}}
{{- $systemName := .Values.systemName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artifactory-common.fullname" . }}-entrypoint
  labels:
    {{- include "artifactory-common.labels" . | nindent 4 }}
data:
  run.sh: |-
    #!/bin/bash

    set -eu

    # Artifactory needs to encrypt sensitive details such as join keys and database passwords, and
    # save those changes on the file system. Since secrets are mounted to read-only volumes, there
    # will be read-only file system errors. To work around this, we don't directly mount secrets to
    # the destinations expected by Artifactory. Rather, we mount them to intermediate volumes and then
    # copy them to the target directories where Artifactory expects them.

    set_file_ownership() {
      local file="$1"
      chmod 600 "${file}"
      chown "${JF_ARTIFACTORY_USER}":"${JF_ARTIFACTORY_USER}" "${file}"
    }

    copy_keys() {
      local system_name="$1"

      local security_dir="${JF_PRODUCT_HOME}"/var/etc/security

      mkdir -p "${security_dir}"

      local join_key="${security_dir}"/join.key
      cp /run/secrets/artifactory/"${system_name}"/join.key "${join_key}"
      $(set_file_ownership "${join_key}")

      local master_key="${security_dir}"/master.key
      cp /run/secrets/artifactory/"${system_name}"/master.key "${master_key}"
      $(set_file_ownership "${master_key}")
    }

    copy_system_yaml() {
      local system_name="$1"

      local etc_dir="${JF_PRODUCT_HOME}"/var/etc

      mkdir -p "${etc_dir}"

      cp /run/secrets/artifactory/"${system_name}"/system.yaml "${etc_dir}"/system.yaml
    }

    copy_bootstrap_creds() {
      local access_dir="${JF_PRODUCT_HOME}"/var/etc/access

      mkdir -p "${access_dir}"

      local bootstrap_creds="${access_dir}"/bootstrap.creds

      cp /run/secrets/artifactory/access/bootstrap.creds "${bootstrap_creds}"

      chmod 600 "${bootstrap_creds}"
      chown "${JF_ARTIFACTORY_USER}":"${JF_ARTIFACTORY_USER}" "${bootstrap_creds}"
    }

    copy_configs() {
      local source_config="/run/configs/artifactory/artifactory.config.import.yml"
      local dest_config_dir="${JF_PRODUCT_HOME}/var/etc/artifactory"
      local dest_config="${dest_config_dir}/artifactory.config.import.yml"

      # Ensure source exists before proceeding
      if [[ ! -f "$source_config" ]]; then
        echo "Warning: Source ConfigMap not found at $source_config. Skipping sync."
        return 0
      fi

      # Create directory if missing
      if [[ ! -d "$dest_config_dir" ]]; then
        mkdir -p "$dest_config_dir"
      fi

      # 1. Check if the destination exists
      if [[ ! -f "$dest_config" ]]; then
        echo "Config not found at destination. Performing initial copy..."
        cp "$source_config" "$dest_config"
        chmod 644 "$dest_config"
      else
        # 2. Compare checksums
        local src_sum dest_sum
        src_sum=$(md5sum "$source_config" | awk '{print $1}')
        dest_sum=$(md5sum "$dest_config" | awk '{print $1}')

        if [[ "$src_sum" != "$dest_sum" ]]; then
          echo "Change detected in ConfigMap. Updating local config..."
          # Use -p to preserve permissions/timestamps during the overwrite
          cp -p "$source_config" "$dest_config"
        else
          echo "No changes detected in config. Skipping copy."
        fi
      fi
    }

    copy_keys {{ $systemName | quote }}
    copy_system_yaml {{ $systemName | quote }}
    copy_bootstrap_creds
    copy_configs
    /entrypoint-artifactory.sh
{{- end -}}