{{- $service := .Values.service | default dict -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart-repository.fullname" . }}
  labels:
    {{- include "chart-repository.labels" . | nindent 4 }}
spec:
  type: {{ $service.type | default "ClusterIP" }}
  ports:
    - port: {{ $service.port | default 80 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart-repository.selectorLabels" . | nindent 4 }}
