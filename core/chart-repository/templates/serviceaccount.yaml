{{- $sa := .Values.serviceAccount | default dict -}}
{{- if hasKey $sa "create" | ternary $sa.create true -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart-repository.serviceAccountName" . }}
  labels:
    {{- include "chart-repository.labels" . | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ hasKey $sa "automount" | ternary $sa.automount true }}
{{- end }}
