# Default values for chart-repository.

replicaCount: 1

image:
  repository: ghcr.io/nginx/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.30-alpine-slim"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101
  runAsUser: 101
  runAsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 100Mi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 50Mi

startupProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 2
  periodSeconds: 2
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 15

livenessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

persistence:
  storageClass: ""
  size: 100Mi
  accessModes:
    - ReadWriteOnce

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

repoExtractor:
  image: docker.io/bitnami/kubectl@sha256:0ed36a7f6a94c1b82d70811ed03caf3df92b4b2b8f8817d0f726f0f3a26e64af
  envMap:
    FLUX_GIT_REPO_NAME: helm
  command: 
    - /bin/bash
    - -c
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 50Mi
  script: |
    set -euo pipefail

    repo_name="${FLUX_GIT_REPO_NAME:-}"
    current_ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
    namespace="${FLUX_GIT_REPO_NAMESPACE:-${current_ns}}"

    echo "🔍 Querying GitRepository ${namespace}/${repo_name}..."
    artifact_url=$(kubectl get gitrepository "${repo_name}" -n "${namespace}" -o jsonpath='{.status.artifact.url}')

    if [ -z "${artifact_url}" ]; then
      echo "ERROR: Artifact URL not found in GitRepository status."
      exit 1
    fi

    path="/$(echo "${artifact_url}" | cut -d/ -f4-)"

    echo "📥 Downloading artifact via API server proxy: ${path}"
    kubectl get --raw "/api/v1/namespaces/flux-system/services/http:source-controller:80/proxy${path}" > /src/charts.tar.gz

    echo "✅ Download complete. Artifact saved to /src/charts.tar.gz"

chartPackager:
  image: alpine/helm:3.20.2
  envMap:
    RETENTION_ENABLED: "true"
    RETENTION_DAYS: "7"
    RETENTION_KEEP: "5"
    RETENTION_DRY_RUN: "false"
  command:
    - sh
    - -c
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 100Mi
  script: |
    set -euo pipefail

    echo "📦 Extracting source code..."
    if [ -f /src/charts.tar.gz ]; then
      tar -xzf /src/charts.tar.gz -C /src
    else
      echo "ERROR: Source tarball /src/charts.tar.gz not found!"
      exit 1
    fi

    cleanup_by_pattern() {
      local dir="$1"
      local pattern="$2"
      local days="${RETENTION_DAYS:-7}"
      local keep="${RETENTION_KEEP:-5}"
      local dry_run="${RETENTION_DRY_RUN:-false}"

      echo "Applying retention policy for ${pattern} in ${dir}..."

      # List files matching the pattern, sorted by modification time (newest first)
      local files
      files=$(ls -1t "${dir}"/$(basename "${pattern}") 2>/dev/null || true)

      if [ -z "$files" ]; then
        echo "No files found matching pattern ${pattern} in ${dir}. Skipping cleanup."
        return 0
      fi

      local count
      count=$(echo "$files" | grep -c . || true)

      if [ "$count" -gt "$keep" ]; then
        # Select files after the Nth version for potential deletion
        echo "$files" | tail -n +$((keep + 1)) | while read -r file; do
          if [ -n "$(find "$file" -mtime +"$days" 2>/dev/null)" ]; then
            if [ "${dry_run}" = "true" ]; then
              echo "[DRY RUN] Would remove old version: $file"
            else
              echo "Removing old version: $file"
              rm -f "$file"
            fi
          fi
        done
      fi
    }

    cleanup() {
      local dir="$1"
      echo "Starting cleanup for all charts in ${dir} (Policy: Keep ${RETENTION_KEEP:-5} versions, Max age ${RETENTION_DAYS:-7} days)..."

      # Identify unique chart names by stripping the version and extension.
      # Helm packages follow the pattern: <name>-<version>.tgz
      local names
      names=$(ls -1 "${dir}"/*.tgz 2>/dev/null | sed -E 's|.*/||; s|-[vV]?[0-9].*\.tgz$||' | sort -u || true)

      if [ -z "$names" ]; then
        echo "No chart files found in ${dir} to clean up."
        return 0
      fi

      for name in $names; do
        cleanup_by_pattern "$dir" "${name}-*.tgz"
      done
    }

    get_chart_directories() {
      local base_dir="$1"
      # Find all Chart.yaml files recursively. Does not follow symbolic links by default.
      find "${base_dir}" -name "Chart.yaml" | while read -r chart_yaml; do
        local chart_dir
        chart_dir=$(dirname "${chart_yaml}")

        # Skip if the directory itself is a symbolic link to avoid loops
        if [ ! -L "${chart_dir}" ]; then
          # Return the path relative to /src (e.g., core/postgres)
          echo "${chart_dir#/src/}"
        fi
      done
    }

    package_all() {
      local base_dir="$1"
      local exclude_charts="${2:-}"

      local chart_dirs
      chart_dirs=$(get_chart_directories "${base_dir}")

      for chart_rel_path in ${chart_dirs}; do
        local chart_yaml="/src/${chart_rel_path}/Chart.yaml"
        local name
        name=$(grep -m1 '^name:' "${chart_yaml}" | sed 's/^name:[[:space:]]*//' | tr -d '\r')

        # We apply the "Guard Space" (padding with spaces) here to ensure
        # we match the whole name and not just a substring.
        case " ${exclude_charts} " in
          *" ${name} "*)
            echo "⏭️  Excluding chart per exclude_charts parameter: ${name}"
            continue
            ;;
        esac

        package "${chart_rel_path}"
      done
    }

    package() {
      local chart_dir="$1"
      local full_path="/src/${chart_dir}"
      local schema_file="${full_path}/values.schema.json"
      local schema_modified="false"

      echo "================================================================================"
      echo "Processing chart: ${chart_dir}"
      echo "================================================================================"

      if [ ! -d "${full_path}" ]; then
        echo "⚠️ Skipping ${chart_dir}: directory not found in /src"
        return 0
      fi

      if [ -f "${schema_file}" ]; then
        echo "🔧 Converting relative file:// paths in ${chart_dir}/values.schema.json to absolute..."
        cp "${schema_file}" "${schema_file}.bak"
        # Prepend the absolute path to handle relative references during linting
        sed -i "s|file://\([^/]\)|file://${full_path}/\1|g" "${schema_file}"
        schema_modified="true"
      fi

      echo "▶ Building dependencies for ${chart_dir}..."
      helm dependency build "${full_path}"

      echo "▶ Linting ${chart_dir}..."
      helm lint "${full_path}"

      if [ "${schema_modified}" = "true" ]; then
        echo "🗑️  Removing modified values.schema.json before packaging..."
        rm "${schema_file}"
      fi

      echo "📦 Packaging ${chart_dir}..."
      helm package "${full_path}" -d /usr/share/nginx/html/charts/

      if [ "${schema_modified}" = "true" ]; then
        echo "🔄 Restoring original values.schema.json..."
        mv "${schema_file}.bak" "${schema_file}"
      fi
    }

    # Ensure the target directory path exists on the volume
    mkdir -p /usr/share/nginx/html/charts
    
    # Initialize the index file immediately. This ensures that as soon as the
    # init container completes (and the main Nginx container starts), the
    # file required by the probes is guaranteed to exist, even if the
    # packaging process below takes a long time or is partially skipped.
    if [ ! -f /usr/share/nginx/html/charts/index.yaml ]; then
      echo "Initializing Helm repository index..."
      helm repo index /usr/share/nginx/html/charts/
    fi

    if [ "${RETENTION_ENABLED:-false}" = "true" ]; then
      echo "Running global artifact retention cleanup..."
      cleanup "/usr/share/nginx/html/charts"
    fi

    echo "Starting chart packaging process..."
    package_all "/src/core" "artifactory-common chart-repository"
    echo "All chart packaging successfully completed!"

    echo "Generating Helm repository index..."
    helm repo index /usr/share/nginx/html/charts/
    echo "Helm repository index successfully generated!"
