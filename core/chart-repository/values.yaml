# Default values for chart-repository.

replicaCount: 1

image:
  repository: ghcr.io/nginx/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.30-alpine-slim"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101
  runAsUser: 101
  runAsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

startupProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 2
  periodSeconds: 2
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 15

livenessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

volumes:
  - name: charts-dir
    emptyDir: {}
  - name: git-source-dir
    emptyDir: {}

volumeMounts:
  - name: charts-dir
    mountPath: /usr/share/nginx/html/charts
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

repoExtractor:
  image: alpine/helm:3.20.2
  envMap:
    FLUX_GIT_REPO_NAME: helm
  command: 
    - sh
    - -c
  script: |
    set -euo pipefail

    extract_flux_artifact() {
      local current_namespace
      local namespace
      local repo_name
      local token
      local ca_cert
      local api_server
      local response
      local artifact_url

      current_namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
      namespace="${FLUX_GIT_REPO_NAMESPACE:-${current_namespace}}"
      repo_name="${FLUX_GIT_REPO_NAME:-}"
      token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
      ca_cert="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      api_server="https://kubernetes.default.svc"

      if [ -z "${repo_name}" ]; then
        echo "ERROR: FLUX_GIT_REPO_NAME environment variable is not set or is blank."
        exit 1
      fi

      echo "Querying Kubernetes API for Flux GitRepository: ${namespace}/${repo_name}"

      response="$(curl -sS --fail --cacert "${ca_cert}" \
        -H "Authorization: Bearer ${token}" \
        "${api_server}/apis/source.toolkit.fluxcd.io/v1/namespaces/${namespace}/gitrepositories/${repo_name}")"

      artifact_url="$(echo "${response}" | grep -oE 'http://source-controller[^"]+' | head -n 1 || true)"

      if [ -z "${artifact_url:-}" ]; then
        echo "ERROR: Could not parse artifact URL for ${repo_name}. API Response:"
        echo "${response}" | head -n 5
        exit 1
      fi

      echo "Downloading and extracting artifact from: ${artifact_url}"
      curl -sSL --fail "${artifact_url}" | tar -xzf - -C /src

      echo "Artifact ${repo_name} successfully extracted to /src"
    }

    # Ensure /src exists before extraction
    mkdir -p /src

    # Extract the source code from Flux
    extract_flux_artifact
  volumeMounts:
  - name: git-source-dir
    mountPath: /src

chartPackager:
  image: alpine/helm:3.20.2
  command:
    - sh
    - -c
  script: |
    set -euo pipefail

    package_artifactory_jcr() {
      local schema_file="/src/core/artifactory-jcr/values.schema.json"

      echo "Modifying values.schema.json reference path for artifactory-jcr..."
      # Swap the relative file path with the absolute container path
      sed -i 's|file://../artifactory-common/values.schema.json|file:///src/core/artifactory-common/values.schema.json|g' "${schema_file}"

      echo "Building chart dependencies for artifactory-jcr..."
      helm dependency build /src/core/artifactory-jcr

      echo "Linting chart configuration for artifactory-jcr..."
      helm lint /src/core/artifactory-jcr

      echo "Packaging chart artifactory-jcr..."
      helm package /src/core/artifactory-jcr -d /usr/share/nginx/html/charts/
      echo "Helm repository index successfully generated!"
    }

    # Ensure the target directory path exists on the emptyDir volume
    mkdir -p /usr/share/nginx/html/charts

    echo "Starting chart packaging process..."
    package_artifactory_jcr

    echo "All chart packaging successfully completed!"

    echo "Generating Helm repository index..."
    helm repo index /usr/share/nginx/html/charts/
  volumeMounts:
    - name: git-source-dir
      mountPath: /src
    - name: charts-dir
      mountPath: /usr/share/nginx/html/charts
