# Default values for chart-repository.

replicaCount: 1

image:
  repository: ghcr.io/nginx/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.30-alpine-slim"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 101
  runAsUser: 101
  runAsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 100Mi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 50Mi

startupProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 2
  periodSeconds: 2
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 15

livenessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /charts/index.yaml
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

persistence:
  storageClass: ""
  size: 100Mi
  accessModes:
    - ReadWriteOnce

volumes: []
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

repoExtractor:
  image: docker.io/bitnami/kubectl@sha256:0ed36a7f6a94c1b82d70811ed03caf3df92b4b2b8f8817d0f726f0f3a26e64af
  envMap:
    FLUX_GIT_REPO_NAME: helm
  command: 
    - /bin/bash
    - -c
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 50Mi
  script: |
    set -euo pipefail

    repo_name="${FLUX_GIT_REPO_NAME:-}"
    current_ns="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
    namespace="${FLUX_GIT_REPO_NAMESPACE:-${current_ns}}"

    echo "🔍 Querying GitRepository ${namespace}/${repo_name}..."
    artifact_url=$(kubectl get gitrepository "${repo_name}" -n "${namespace}" -o jsonpath='{.status.artifact.url}')

    if [ -z "${artifact_url}" ]; then
      echo "ERROR: Artifact URL not found in GitRepository status."
      exit 1
    fi

    path="/$(echo "${artifact_url}" | cut -d/ -f4-)"

    echo "📥 Downloading artifact via API server proxy: ${path}"
    kubectl get --raw "/api/v1/namespaces/flux-system/services/http:source-controller:80/proxy${path}" > /src/charts.tar.gz

    echo "✅ Download complete. Artifact saved to /src/charts.tar.gz"

chartPackager:
  image: alpine/helm:3.20.2
  envMap:
    RETENTION_ENABLED: "true"
    RETENTION_DAYS: "7"
    RETENTION_KEEP: "5"
    RETENTION_DRY_RUN: "false"
  command:
    - sh
    - -c
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 100Mi
  script: |
    set -euo pipefail

    # Ensure cleanup happens even if the script exits early due to an error
    cleanup_src() {
      echo "Cleaning up source directory..."
      rm -rf /src/*
    }
    trap cleanup_src EXIT

    echo "📦 Extracting source code..."
    if [ -f /src/charts.tar.gz ]; then
      tar -xzf /src/charts.tar.gz -C /src
      rm /src/charts.tar.gz
    else
      echo "ERROR: Source tarball /src/charts.tar.gz not found!"
      exit 1
    fi

    cleanup_by_pattern() {
      local dir="$1"
      local pattern="$2"
      local days="${RETENTION_DAYS:-7}"
      local keep="${RETENTION_KEEP:-5}"
      local dry_run="${RETENTION_DRY_RUN:-false}"

      echo "Applying retention policy for ${pattern} in ${dir}..."

      # List files matching the pattern, sorted by modification time (newest first)
      local files
      files=$(ls -1t "${dir}"/$(basename "${pattern}") 2>/dev/null || true)

      if [ -z "$files" ]; then
        echo "No files found matching pattern ${pattern} in ${dir}. Skipping cleanup."
        return 0
      fi

      local count
      count=$(echo "$files" | grep -c . || true)

      if [ "$count" -gt "$keep" ]; then
        # Select files after the Nth version for potential deletion
        echo "$files" | tail -n +$((keep + 1)) | while read -r file; do
          if [ -n "$(find "$file" -mtime +"$days" 2>/dev/null)" ]; then
            if [ "${dry_run}" = "true" ]; then
              echo "[DRY RUN] Would remove old version: $file"
            else
              echo "Removing old version: $file"
              rm -f "$file"
            fi
          fi
        done
      fi
    }

    cleanup() {
      local dir="$1"
      echo "Starting cleanup for all charts in ${dir} (Policy: Keep ${RETENTION_KEEP:-5} versions, Max age ${RETENTION_DAYS:-7} days)..."

      # Identify unique chart names by stripping the version and extension.
      # Helm packages follow the pattern: <name>-<version>.tgz
      local names
      names=$(ls -1 "${dir}"/*.tgz 2>/dev/null | sed -E 's|.*/||; s|-[vV]?[0-9].*\.tgz$||' | sort -u || true)

      if [ -z "$names" ]; then
        echo "No chart files found in ${dir} to clean up."
        return 0
      fi

      for name in $names; do
        cleanup_by_pattern "$dir" "${name}-*.tgz"
      done
    }

    package_artifactory_jcr() {
      local schema_file="/src/core/artifactory-jcr/values.schema.json"

      echo "Modifying values.schema.json reference path for artifactory-jcr..."
      # Swap the relative file path with the absolute container path
      sed -i 's|file://../artifactory-common/values.schema.json|file:///src/core/artifactory-common/values.schema.json|g' "${schema_file}"

      echo "Building chart dependencies for artifactory-jcr..."
      helm dependency build /src/core/artifactory-jcr

      echo "Linting chart configuration for artifactory-jcr..."
      helm lint /src/core/artifactory-jcr

      # The schema is only needed for the linting step above.
      rm "${schema_file}"

      echo "Packaging chart artifactory-jcr..."
      helm package /src/core/artifactory-jcr -d /usr/share/nginx/html/charts/
    }

    # Ensure the target directory path exists on the volume
    mkdir -p /usr/share/nginx/html/charts

    if [ "${RETENTION_ENABLED:-false}" = "true" ]; then
      echo "Running global artifact retention cleanup..."
      cleanup "/usr/share/nginx/html/charts"
    fi

    echo "Starting chart packaging process..."
    package_artifactory_jcr

    echo "All chart packaging successfully completed!"

    echo "Generating Helm repository index..."
    helm repo index /usr/share/nginx/html/charts/
    echo "Helm repository index successfully generated!"
