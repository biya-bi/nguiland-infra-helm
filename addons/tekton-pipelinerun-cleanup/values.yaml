image:
  repository: "docker.io/bitnami/kubectl@sha256"
  pullPolicy: "IfNotPresent"
  tag: "0ed36a7f6a94c1b82d70811ed03caf3df92b4b2b8f8817d0f726f0f3a26e64af"

command:
  - /bin/bash
  - -c

serviceAccount:
  create: false
  name: "tekton-pipeline"

schedule: "0 * * * *"

envMap:
  NAMESPACE: "infra"
  MIN_AGE_MINUTES: "60"
  DRY_RUN: "false"
  PARALLELISM: "5"
  MAX_DELETIONS: "50"

script: |
  set -euo pipefail

  log() { 
    echo "[$(date)] $*";
  }

  # Validate required env vars
  : "${NAMESPACE:?ERROR: NAMESPACE is required}"
  : "${MIN_AGE_MINUTES:?ERROR: MIN_AGE_MINUTES is required}"
  : "${DRY_RUN:?ERROR: DRY_RUN is required}"
  : "${PARALLELISM:?ERROR: PARALLELISM is required}"
  : "${MAX_DELETIONS:?ERROR: MAX_DELETIONS is required}"

  if ! [[ "$MIN_AGE_MINUTES" =~ ^[0-9]+$ ]]; then
    echo "ERROR: MIN_AGE_MINUTES must be a positive integer"; exit 1
  fi

  # Enforce parallelism range
  if [ "$PARALLELISM" -lt 1 ] || [ "$PARALLELISM" -gt 20 ]; then
    echo "ERROR: PARALLELISM must be between 1 and 20"; exit 1
  fi

  case "$DRY_RUN" in
    true|false) ;;
    *) echo "ERROR: DRY_RUN must be 'true' or 'false'"; exit 1 ;;
  esac

  log "Starting cleanup (dry-run=$DRY_RUN, namespace=$NAMESPACE)"

  now=$(date +%s)
  results=$(kubectl get pipelineruns -n "$NAMESPACE" \
    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.creationTimestamp}{" "}{.status.conditions[0].status}{"\n"}{end}' 2>/dev/null || true)

  if [ -z "$results" ]; then
      log "No PipelineRuns found"
      exit 0
  fi

  count=0; deleted=0; skipped=0; failed=0; selected=0; to_delete=""

  while IFS= read -r line; do
      name=$(echo "$line" | awk '{print $1}')
      created=$(echo "$line" | awk '{print $2}')
      status=$(echo "$line" | awk '{print $3}')

      [ -z "$name" ] || [ -z "$created" ] || [ -z "$status" ] && continue
      [[ "$status" != "True" && "$status" != "False" ]] && continue

      created_ts=$(date -d "$created" +%s 2>/dev/null) || continue
      age_minutes=$(( (now - created_ts) / 60 ))
      count=$((count + 1))

      if [ "$age_minutes" -lt "$MIN_AGE_MINUTES" ]; then
          skipped=$((skipped + 1))
          continue
      fi

      if [ "$selected" -ge "$MAX_DELETIONS" ]; then
          log "Reached MAX_DELETIONS=$MAX_DELETIONS, stopping selection"
          break
      fi

      if [ "$DRY_RUN" = "true" ]; then
          log "[DRY-RUN] Would delete: $name (${age_minutes}m old)"
          continue
      fi

      to_delete="${to_delete}${name}\n"
      selected=$((selected + 1))
  done <<< "$results"

  if [ "$DRY_RUN" = "false" ] && [ -n "$to_delete" ]; then
      log "Deleting PipelineRuns with parallelism=$PARALLELISM"
      echo -e "$to_delete" | xargs -P "$PARALLELISM" -I {} sh -c '
          if kubectl delete pipelinerun "{}" -n "'"$NAMESPACE"'" --ignore-not-found=true >/dev/null 2>&1; then
              echo "Deleted: {}"
          else
              echo "FAILED: {}"
          fi
      ' | while read -r line; do
          log "$line"
          case "$line" in
              Deleted:*) deleted=$((deleted + 1)) ;;
              FAILED:*) failed=$((failed + 1)) ;;
          esac
      done
  fi

  log "Summary: processed=$count selected=$selected deleted=$deleted skipped=$skipped failed=$failed"
