# Default values for cronjob-common.

schedule: "0 * * * *"

script: ""
command:
  - /bin/sh
  - -c

concurrencyPolicy: Forbid
startingDeadlineSeconds: 1800
suspend: false

image:
  repository: alpine
  pullPolicy: IfNotPresent
  tag: "3.23"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsGroup: 1001
  fsGroupChangePolicy: "OnRootMismatch"

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false

envMap: {}

envSecrets: []

successfulJobsHistoryLimit: 1

failedJobsHistoryLimit: 3
ttlSecondsAfterFinished: 3300
backoffLimit: 2
restartPolicy: OnFailure
activeDeadlineSeconds: 3600
terminationGracePeriodSeconds: 30

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
