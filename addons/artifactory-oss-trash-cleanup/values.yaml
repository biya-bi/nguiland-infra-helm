imagePullEndpoint: "artifactory-jcr.infra"

image:
  repository: "docker-local/org.nguiland.infra/alpine-ops-toolkit"
  pullPolicy: "IfNotPresent"
  tag: "latest"

imagePullSecrets: 
  - name: docker-config

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

schedule: "0 */6 * * *"

artOssUrl: "http://artifactory-oss:8082/artifactory"

envMap:
  MAX_TRASH_AGE_HOURS: 48

envSecrets:
  - name: ART_OSS_USER
    valueFrom:
      secretKeyRef:
        name: artifactory-oss
        key: user
  - name: ART_OSS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: artifactory-oss
        key: password

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

script: |
    set -euo pipefail

    # Change to a writable directory since some base images have read-only root filesystems
    cd /tmp

    echo "=== Safe Trash Cleanup ==="

    NOW=$(date +%s)
    CUTOFF=$((NOW - MAX_TRASH_AGE_HOURS * 3600))

    echo "Fetching trash items..."

    curl -sS --fail \
      -u "$ART_OSS_USER:$ART_OSS_PASSWORD" \
      "$ART_OSS_URL/api/trash" > trash.json

    TOTAL=$(jq '.files | length' trash.json)
    echo "Total trash items: $TOTAL"

    if [ "$TOTAL" -eq 0 ]; then
      echo "Trash is empty."
      exit 0
    fi

    echo "Filtering old trash items..."

    jq -r --argjson cutoff "$CUTOFF" '
      .files[]
      | .deleted_epoch = (
          try (.deleted | split(".")[0] + "Z" | fromdateiso8601)
          catch 0
        )
      | select(.deleted_epoch < $cutoff)
      | .repo + "/" + .path + "/" + .name
    ' trash.json > delete.txt

    COUNT=$(grep -c . delete.txt || true)
    echo "Trash items to delete: $COUNT"

    if [ "$COUNT" -eq 0 ]; then
      echo "Nothing to delete."
      exit 0
    fi

    cat delete.txt

    echo "Deleting old trash..."

    while read -r item; do
      curl -sS --fail \
        -u "$ART_OSS_USER:$ART_OSS_PASSWORD" \
        -X DELETE "$ART_OSS_URL/api/trash/$item"
    done < delete.txt

    echo "Trash cleanup complete."
