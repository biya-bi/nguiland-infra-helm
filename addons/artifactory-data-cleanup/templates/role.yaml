apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cronjob-common.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronjob-common.labels" . | nindent 4 }}
rules:
- apiGroups:
    - ""
  resources:
    - pods
  verbs:
    - get
    - list
- apiGroups:
    - ""
  resources:
    - pods/exec
  verbs:
    - create
