image:
  repository: "artifactory-jcr.infra/docker-local/org.nguiland.infra/alpine-ops-toolkit"
  tag: "1.0.0"

imagePullSecrets:
  - name: docker-config

schedule: "0 * * * *"

command:
  - /bin/bash
  - -c

podSecurityContext:
  fsGroup: 1030
  runAsUser: 1030
  runAsGroup: 1030

envMap:
  SYSTEM_NAMES: "jcr oss"
  # If left empty, the namespace of the pod will be used.
  SYSTEM_NAMESPACE: ""

script: |
  set -euo pipefail

  # This function is serialized and executed inside the target Artifactory pod
  cleanup_pod() {
    set -euo pipefail

    local pod_name="${1:-unknown}"

    local red='\033[0;31m'
    local yellow='\033[0;33m'
    local no_color='\033[0m'

    printf "INFO: Running cleanup in pod %s\n" "$pod_name"

    local dir="/opt/jfrog/artifactory/var"

    if [ ! -d "$dir" ]; then
      printf "%bERROR: Directory does not exist: $dir%b\n" "$red" "$no_color"
      return 0
    fi

    local system_yaml="/opt/jfrog/artifactory/var/etc/system.yaml"

    if [ ! -f "$system_yaml" ]; then
      printf "%bERROR: File does not exist: $system_yaml%b\n" "$red" "$no_color"
      return 0
    fi

    local raw_allow
    raw_allow=$(grep -A 2 "observability:" "$system_yaml" | grep -A 1 "consumption:" | grep "allow:" | head -1 | sed "s/.*allow: *//")
    local allow
    allow=$(printf '%s\n' "$raw_allow" | sed -e 's/^[[:space:]]*//;s/[[:space:]]*$//' -e 's/"//g' -e "s/'//g")

    if [ -z "$allow" ]; then
      local archived_dir="$dir/data/metadata/usage/archived"
      if [ -d "$archived_dir" ]; then
        if [ -n "$(ls "$archived_dir" 2>/dev/null)" ]; then
          rm -rf "$archived_dir"/*
          printf "INFO: Deleted contents of %s\n" "$archived_dir"
        else
          printf "INFO: No files to delete in %s\n" "$archived_dir"
        fi
      else
        printf "%bWARN: Directory does not exist: $archived_dir%b\n" "$yellow" "$no_color"
      fi
    else
      printf "%bINFO: observability.consumption.allow is set to '$allow', skipping deletion%b\n" "$yellow" "$no_color"
    fi
  }

  get_namespace() {
    if [ -n "${SYSTEM_NAMESPACE:-}" ]; then
      echo "$SYSTEM_NAMESPACE"
    else
      cat /var/run/secrets/kubernetes.io/serviceaccount/namespace
    fi
  }

  get_ready_system_names() {
    local namespace="${1:-}"
    local system_names="${2:-}"
    local yellow='\033[0;33m'
    local no_color='\033[0m'

    if [ -z "$system_names" ]; then
      printf "%bWARN: The system names list is empty. No systems to process.%b\n" "$yellow" "$no_color" >&2
      return 0
    fi

    local ready_system_names=""
    for name in $system_names; do
      # Check if any pod for this system is currently Ready (True)
      if kubectl get pods --request-timeout=20s -n "$namespace" -l "app.kubernetes.io/name=artifactory-${name}" -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"; then
        ready_system_names="${ready_system_names}${name} "
      fi
    done

    if [ -z "$ready_system_names" ]; then
      printf "%bWARN: None of the provided systems (${system_names}) are currently ready or deployed.%b\n" "$yellow" "$no_color" >&2
      return 0
    fi

    echo "${ready_system_names% }"
  }

  cleanup_remote_pod() {
    local namespace
    namespace=$(get_namespace)

    local ready_system_names
    ready_system_names=$(get_ready_system_names "$namespace" "${SYSTEM_NAMES:-}")

    if [ -z "$ready_system_names" ]; then
      return 0
    fi

    local yellow='\033[0;33m'
    local no_color='\033[0m'

    for system_name in $ready_system_names; do
      # Get the first active pod name for the system
      local pod_name
      pod_name=$(kubectl get pod --request-timeout=20s -n "$namespace" -l "app.kubernetes.io/name=artifactory-${system_name}" -o jsonpath='{.items[*].metadata.name}' | awk '{print $1}')

      if [ -z "$pod_name" ]; then
        printf "%bWARN: No active pod found for ${system_name}.%b\n" "$yellow" "$no_color"
        continue
      fi

      printf "INFO: Processing system %s in pod %s\n" "$system_name" "$pod_name"

      # Execute the cleanup logic inside the remote pod
      kubectl exec --request-timeout=20s -n "$namespace" "$pod_name" -c "artifactory-${system_name}" -- bash -c "$(declare -f cleanup_pod); cleanup_pod $pod_name"
    done
  }

  printf "=== Artifactory Data Cleanup ===\n"
  cleanup_remote_pod
